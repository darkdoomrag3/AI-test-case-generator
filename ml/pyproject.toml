[project]
name = "qa-workbench-ml"
version = "0.1.0"
description = "Test-case quality scoring and suite analysis for QA Workbench"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
# Run tests from the ml/ directory; make app/ and training/ importable.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
